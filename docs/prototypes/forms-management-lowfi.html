<body>
  <!-- 单页询单管理交互原型：统计与列表两类工作视图。 -->
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="brand-mark">H</span>恒达微波 · 管理后台</div>
      <button>⌂　首页</button><button class="active">▣　官网内容原型</button><button class="sub">方案管理</button><button class="sub">新闻中心管理</button><button class="sub active">询单管理</button>
      <button>♙　用户</button><button>▤　产品</button>
      <button>▣　订单</button><button>⚙　系统</button><button>▦　招聘</button><button>♙　群聊</button>
      <div class="side-note">高保真交互探索<br>内容仅为示例数据</div>
    </aside>
    <main class="main">
      <div class="topbar"><div class="crumb">首页　/　官网内容原型　/　<b id="crumb-title">询单管理</b></div><div class="user"><span>演示管理员</span><span class="avatar">管</span></div></div>
      <section class="page">
        <div class="tabs" role="tablist"><button class="tab active" data-tab="stats" role="tab">询单统计</button><button class="tab" data-tab="records" role="tab">询单管理</button></div>
        <section id="stats-view">
          <div class="panel"><div class="panel-head"><h2>统计条件</h2><span class="muted">按询单提交时间</span></div><div class="filters"><div class="range-presets"><button class="range-btn" data-range="all">全部时间</button><button class="range-btn" data-range="7">近 7 天</button><button class="range-btn" data-range="30">近 30 天</button><button class="range-btn" data-range="quarter">本季度</button><button class="range-btn" data-range="custom">自定义</button></div><label class="filter-label">开始日期<input class="control" id="stat-start" type="date"></label><label class="filter-label">结束日期<input class="control" id="stat-end" type="date"></label><select class="control" id="stat-type"><option>全部类别</option></select><select class="control" id="stat-status"><option>全部状态</option><option>待处理</option><option>处理中</option><option>已完成</option><option>无效</option></select><button class="btn" id="stat-reset">重置筛选</button></div></div>

    function renderStatsProfessional(){const rows=statFiltered(),states=["待处理","处理中","已完成","无效"],countFor=(list,state)=>list.filter(r=>r.status===state).length,total=rows.length,dates=records.map(r=>r.time.slice(0,10)).sort(),from=document.querySelector("#stat-start").value||dates[0],to=document.querySelector("#stat-end").value||dates.at(-1),start=new Date(`${from}T00:00:00Z`),end=new Date(`${to}T00:00:00Z`),span=Math.max(1,Math.round((end-start)/86400000)+1),previousStart=new Date(start);previousStart.setUTCDate(previousStart.getUTCDate()-span);const previousEnd=new Date(start);previousEnd.setUTCDate(previousEnd.getUTCDate()-1);const asDay=d=>d.toISOString().slice(0,10),prevFrom=asDay(previousStart),prevTo=asDay(previousEnd),category=document.querySelector("#stat-type").value,statusFilter=document.querySelector("#stat-status").value,previous=records.filter(r=>r.time.slice(0,10)>=prevFrom&&r.time.slice(0,10)<=prevTo&&(category==="全部类别"||r.type===category)&&(statusFilter==="全部状态"||r.status===statusFilter)),change=total-previous.length,changeText=previous.length?`较上期 ${change>0?"+":""}${change}（${change>0?"+":""}${Math.round(change/previous.length*100)}%）`:total?`较上期新增 ${total}`:"较上期无变化",metrics=[["询单总量",total,"本期提交","全部状态"],["待处理",countFor(rows,"待处理"),"当前待处理","待处理"],["处理中",countFor(rows,"处理中"),"当前处理中","处理中"],["已完成",countFor(rows,"已完成"),"当前已完成","已完成"]];document.querySelector("#stats-metrics").innerHTML=metrics.map(([label,value,caption,state],i)=>`<button type="button" class="metric stat-metric" data-stat-status="${state}" title="点击查看${label}询单"><span class="metric-label">${label}</span><span class="metric-num" style="display:block">${value}</span><span class="metric-foot" style="display:block">${i===0?changeText:caption}　→ 查看</span></button>`).join("");document.querySelectorAll("[data-stat-status]").forEach(card=>card.onclick=()=>{startDate=document.querySelector("#stat-start").value;endDate=document.querySelector("#stat-end").value;filterType=category==="全部类别"?"全部类型 are-cell">${total?"100":"0"}%</td></tr>`;document.querySelectorAll("[data-category]").forEach(el=>el.onclick=()=>drillDown(el.dataset.category,"全部状态"));document.querySelectorAll("[data-state]").forEach(el=>el.onclick=()=>drillDown("全部类别",el.dataset.state));document.querySelectorAll("[data-matrix-category]").forEach(el=>el.onclick=()=>drillDown(el.dataset.matrixCategory,el.dataset.matrixStatus));const bucketDays=span>31?7:1,buckets=[];for(let offset=0;offset<span;offset+=bucketDays){const a=new Date(start);a.setUTCDate(a.getUTCDate()+offset);const b=new Date(start);b.setUTCDate(b.getUTCDate()+Math.min(span-1,offset+bucketDays-1));buckets.push({from:asDay(a),to:asDay(b),label:bucketDays===1?asDay(a).slice(5):asDay(a).slice(5)})}const currentCounts=buckets.map(b=>rows.filter(r=>r.time.slice(0,10)>=b.from&&r.time.slice(0,10)<=b.to).length),previousCounts=buckets.map((b,i)=>{const a=new Date(`${b.from}T00:00:00Z`),z=new Date(`${b.to}T00:00:00Z`);a.setUTCDate(a.getUTCDate()-span);z.setUTCDate(z.getUTCDate()-span);return previous.filter(r=>r.time.slice(0,10)>=asDay(a)&&r.time.slice(0,10)<=asDay(z)).length}),peak=Math.max(1,...currentCounts,...previousCounts);document.querySelector("#trend-range").textContent=`${from} 至 ${to}　·　${span>31?"按周":"按日"}`;document.querySelector("#trend-chart").innerHTML=buckets.map((b,i)=>`<div class="trend-col"><div class="trend-count">${currentCounts[i]||""}</div><div class="trend-bars"><div class="trend-bar previous" style="height:${previousCounts[i]?Math.max(4,previousCounts[i]/peak*100):1}%" title="上一周期：${previousCounts[i]} 条"></div><div class="trend-bar current" style="height:${currentCounts[i]?Math.max(4,currentCounts[i]/peak*100):1}%" title="当前周期：${currentCounts[i]} 条"></div></div><div class="trend-day">${b.label}</div></div>`).join("");document.querySelectorAll("[data-range]").forEach(el=>el.classList.toggle("active",el.dataset.range===activeRange))}
    function drillDown(category,status){filterType=category==="全部类别"?"全部类型":category;filterStatus=status;startDate=document.querySelector("#stat-start").value;endDate=document.querySelector("#stat-end").value;activeTab="records";render()}
    function render(){document.querySelector("#stats-view").classList.toggle("hidden",activeTab!=="stats");document.querySelector("#records-view").classList.toggle("hidden",activeTab!=="records");document.querySelectorAll("[data-tab]").forEach(el=>{el.classList.toggle("active",el.dataset.tab===activeTab);el.setAttribute("aria-selected",String(el.dataset.tab===activeTab))});document.querySelector("#crumb-title").textContent="询单管理";if(activeTab==="stats"){renderStats();return}document.querySelector("#variant-content").innerHTML=renderA();bindFilters();document.querySelectorAll("[data-open]").forEach(el=>el.onclick=e=>{e.stopPropagation();openRecord(el.dataset.open)});document.querySelector("#refresh-btn").onclick=()=>showToast("询单已刷新（演示数据）");document.querySelector("#export-btn").onclick=()=>{const rows=filtered();const csv=["询单编号,类别,联系人,电话,公司,来源,提交时间,负责人,状态",...rows.map(r=>[r.id,r.type,r.name,r.phone,r.company,r.source,r.time,r.owner,r.status].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(","))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="询单管理.csv";a.click();URL.revokeObjectURL(a.href)}}
    function openRecord(id){currentId=id;const r=records.find(x=>x.id===id);if(!r)return;document.querySelector("#drawer-title").textContent=r.subject;document.querySelector("#drawer-meta").textContent=`${r.id}　·　${r.type}　·　${r.time}`;document.querySelector("#drawer-body").innerHTML=`<h3 class="section-title">询单信息</h3><div class="fields">${[["联系人",r.name],["联系电话",r.phone],["联系邮箱",r.email],["公司名称",r.company],["来源页面",r.source],...Object.entries(r.fields),["提交内容",r.message]].map(([a,b])=>`<div class="field ${String(b).length>42?"full":""}"><div class="field-label">${esc(a)}</div><div class="field-value">${esc(b)}</div></div>`).join("")}</div><h3 class="section-title">处理信息</h3><label class="manage-row"><span>处理状态</span><select id="edit-status">${["待处理","处理中","已完成","无效"].map(s=>`<option ${r.status===s?"selected":""}>${s}</option>`).join("")}</select></label><label class="manage-row"><span>负责人</span><select id="edit-owner">${["未分派","王琳","赵明","孙悦","李峰","陈洁"].map(s=>`<option ${r.owner===s?"selected":""}>${s}</option>`).join("")}</select></label><label class="manage-row"><span>内部备注</span><textarea class="note-input" id="edit-note" placeholder="仅后台人员可见，记录联系结果或下一步计划"></textarea></label><h3 class="section-title" style="margin-top:20px">处理记录</h3><div class="timeline">${[...r.history].reverse().map(x=>`<p>• ${esc(x)}</p>`).join("")}</div>`;document.querySelector("#detail-backdrop").classList.add("show")}
    function closeRecord(){const r=records.find(x=>x.id===currentId);if(r&&r.status!=="已完成"&&r.status!=="无效"){r.status="已完成";r.history.push(`${new Date().toLocaleString("zh-CN",{hour12:false})}　记录标记为已完成`);render()}document.querySelector("#detail-backdrop").classList.remove("show")}
    function saveRecord(){const r=records.find(x=>x.id===currentId);if(!r)return;const status=document.querySelector("#edit-status").value,owner=document.querySelector("#edit-owner").value,note=document.querySelector("#edit-note").value.trim();if(status!==r.status){r.status=status;r.history.push(`${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}　状态更新为${status}`)}if(owner!==r.owner){r.owner=owner;r.history.push(`${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}　分派给${owner}`)}if(note)r.history.push(`${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}　内部备注：${note}`);document.querySelector("#detail-backdrop").classList.remove("show");render();showToast("处理信息已保存（仅本次演示）")}
    function showToast(text){const t=document.querySelector("#toast");t.textContent=text;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
    document.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{activeTab=el.dataset.tab;render()});document.querySelectorAll("#stat-start,#stat-end").forEach(el=>el.onchange=()=>{activeRange="custom";renderStats()});document.querySelectorAll("#stat-type,#stat-status").forEach(el=>el.onchange=renderStats);document.querySelector("#stat-type").innerHTML='<option>全部类别</option>'+types.map(t=>`<option>${t}</option>`).join("");document.querySelectorAll("[data-range]").forEach(el=>el.onclick=()=>{activeRange=el.dataset.range;const from=document.querySelector("#stat-start"),to=document.querySelector("#stat-end"),today=new Date(),end=new Date(Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()));if(activeRange==="all"||activeRange==="custom"){from.value="";to.value=""}else{let start;if(activeRange==="quarter")start=new Date(Date.UTC(today.getFullYear(),Math.floor(today.getMonth()/3)*3,1));else{start=new Date(end);start.setUTCDate(start.getUTCDate()-(Number(activeRange)-1))}from.value=start.toISOString().slice(0,10);to.value=end.toISOString().slice(0,10)}renderStats()});document.querySelector("#stat-reset").onclick=()=>{activeRange="all";document.querySelector("#stat-start").value="";document.querySelector("#stat-end").value="";document.querySelector("#stat-type").value="全部类别";document.querySelector("#stat-status").value="全部状态";renderStats()};document.querySelector("#close-drawer").onclick=()=>document.querySelector("#detail-backdrop").classList.remove("show");document.querySelector("#detail-backdrop").onclick=e=>{if(e.target.id==="detail-backdrop")e.currentTarget.classList.remove("show")};document.querySelector("#save-record").onclick=saveRecord;document.querySelector("#close-record").onclick=closeRecord;document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelector("#detail-backdrop").classList.remove("show")});render();
  </script>
